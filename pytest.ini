[pytest]
asyncio_mode = auto
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    # Тестовые базы живут в памяти и закрываются сборщиком мусора, а не явно.
    # В боте соединение закрывается в finally (bot/main.py), это проверяется
    # отдельно в tests/test_migrations.py.
    ignore:.*was deleted before being closed.*:ResourceWarning
