# TG Chat Guard: бот + PostgreSQL + Redis.
#
#   cp .env.example .env      # заполнить BOT_TOKEN, POSTGRES_PASSWORD, REDIS_PASSWORD
#   docker compose up -d --build
#   docker compose logs -f bot
#
# Секреты берутся из .env (он в .gitignore). Compose читает его дважды:
# для подстановки ${...} в этом файле и как env_file контейнера бота.

name: tg-chat-guard

x-security: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  bot:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
    image: tg-chat-guard:latest
    env_file: .env
    environment:
      # Перекрывают локальные значения из .env: в сети compose база и Redis
      # доступны по именам сервисов, а не по localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Бот ничего не пишет на диск: файловая система только для чтения,
    # все capabilities сброшены.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    networks:
      - backend

  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуется: база доступна только боту внутри сети.
    # Для отладки с хоста раскомментируйте (только на 127.0.0.1!):
    # ports:
    #   - "127.0.0.1:5432:5432"
    networks:
      - backend

  redis:
    <<: *hardening
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
    environment:
      # redis-cli в healthcheck берёт пароль отсюда и не светит его в `ps`.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

volumes:
  pgdata:
  redisdata:

networks:
  backend:
    driver: bridge
